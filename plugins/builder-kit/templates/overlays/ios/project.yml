# XcodeGen spec for {{PROJECT_NAME}} (an iOS SwiftUI app).
#
# project.yml is the source of truth for the Xcode project. The .xcodeproj is
# generated from it, so you never hand-edit the .xcodeproj and never fight merge
# conflicts in it. Regenerate any time with:
#
#   xcodegen generate
#
# See ios-notes.md for the full toolchain (Xcode, XcodeGen, simulator) and how
# ship targets TestFlight.

name: {{PROJECT_NAME}}

options:
  # Your reverse-DNS prefix. Bundle ids default to <prefix>.<target>, so the app
  # here becomes com.example.{{PROJECT_NAME}}. Change this to your own org prefix.
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  # Swift 5 language mode. A starter should just build; opt into Swift 6 strict
  # concurrency later, on purpose, once there is code that benefits from it.
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0"        # CFBundleShortVersionString
  CURRENT_PROJECT_VERSION: "1"    # CFBundleVersion

targets:
  {{PROJECT_NAME}}:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      # The Swift module name is pinned to a fixed, valid identifier so that
      # `@testable import AppModule` in the tests works regardless of the project
      # name. Project names often contain hyphens (e.g. my-app), which are legal
      # in a target/product name but NOT in a Swift module name.
      PRODUCT_MODULE_NAME: AppModule
      # Let Xcode synthesise Info.plist from these keys. There is no Info.plist
      # file on disk, which is the modern default and keeps the starter minimal.
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # Generate a shared scheme named after the app whose Test action runs the
    # unit tests, so `xcodebuild -scheme {{PROJECT_NAME}} test` works.
    scheme:
      testTargets:
        - {{PROJECT_NAME}}Tests

  {{PROJECT_NAME}}Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      # Depending on the app target makes XcodeGen set TEST_HOST automatically,
      # so these run as hosted unit tests that can reach the app's own code.
      - target: {{PROJECT_NAME}}
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # Resolve the app's symbols against the host at link time so @testable works.
      BUNDLE_LOADER: "$(TEST_HOST)"
